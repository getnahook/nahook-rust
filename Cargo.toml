[package]
name = "nahook"
version = "0.1.1"
edition = "2021"
description = "Official Rust SDK for the Nahook webhook platform"
license = "MIT"
authors = ["Nahook <support@nahook.com>"]
homepage = "https://nahook.com"
documentation = "https://docs.nahook.com"
repository = "https://github.com/getnahook/nahook-rust"
readme = "README.md"
keywords = ["webhook", "nahook", "sdk", "api"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["client", "management"]
client = []
management = []

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tokio = { version = "1", features = ["time"] }
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
proptest = "1"
